# .github/workflows/ai-inline-review.yml
name: AI Inline Review (custom endpoint, OpenAI-OSS 120B)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check AI_API_KEY presence
        run: |
          if [ -z "${{ secrets.AI_API_KEY }}" ]; then
            echo "::error::AI_API_KEY is empty. Add it in Settings → Secrets → Actions."
            exit 1
          fi

      - name: Run AI Inline Review (inline script)
        env:
          # GitHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL:     ${{ github.repository }}
          PR_NUMBER:     ${{ github.event.pull_request.number }}
          BASE_SHA:      ${{ github.event.pull_request.base.sha }}
          HEAD_SHA:      ${{ github.event.pull_request.head.sha }}
          # AI service
          AI_API_URL:   ${{ vars.AI_API_URL || 'https://api.intelligence.io.solutions/api/v1/chat/completions' }}
          AI_API_KEY:   ${{ secrets.AI_API_KEY }}
          AI_API_HDR:   ${{ vars.AI_API_HDR || 'Authorization' }}   # 'Authorization' или 'x-api-key'
          AI_API_MODEL: openai/gpt-oss-120b
        run: |
          python - << 'PY'
          import os, sys, subprocess, json, requests

          REPO      = os.environ["REPO_FULL"]
          PR_NUMBER = os.environ["PR_NUMBER"]
          BASE      = os.environ["BASE_SHA"]
          HEAD      = os.environ["HEAD_SHA"]
          GH_TOKEN  = os.environ["GITHUB_TOKEN"]

          AI_URL    = os.getenv("AI_API_URL","").strip()
          AI_KEY    = os.getenv("AI_API_KEY","").strip()
          AI_HDR    = os.getenv("AI_API_HDR","Authorization").strip()
          AI_MODEL  = os.getenv("AI_API_MODEL","openai/gpt-oss-120b").strip()

          def run(cmd):
              return subprocess.check_output(cmd, shell=True, text=True, stderr=subprocess.STDOUT)

          # 1) Unified diff U=0 (чтобы номера строк new-файла совпадали)
          try:
              diff = run(f'git diff --unified=0 --no-color "{BASE}" "{HEAD}"')
          except subprocess.CalledProcessError as e:
              print("::error::git diff failed:", e.output)
              sys.exit(1)

          if not diff.strip():
              print("::notice::Empty diff. Nothing to review.")
              sys.exit(0)

          # 2) Соберём карту добавленных строк
          files=[]; current=None; new_line=None
          for line in diff.splitlines():
              if line.startswith("diff --git "):
                  current={"path":None,"hunks":[]}; files.append(current); new_line=None
              elif line.startswith("+++ b/"):
                  if current: current["path"]=line[len("+++ b/"):].strip()
              elif line.startswith("@@"):
                  try:
                      marker=line.split("@@")[1].strip()
                      plus=[p for p in marker.split() if p.startswith('+')][0][1:]
                      new_line=int(plus.split(',')[0]) if ',' in plus else int(plus)
                      current["hunks"].append({"start":new_line,"lines":[]})
                  except Exception:
                      pass
              else:
                  if current and current["hunks"]:
                      h=current["hunks"][-1]
                      if line.startswith('+') and not line.startswith('+++'):
                          h["lines"].append({"line":new_line,"text":line[1:]}); new_line+=1
                      elif line.startswith('-') and not line.startswith('---'):
                          pass
                      else:
                          new_line+=1

          # 3) Обрежем очень большие PR
          MAX_CHARS=120_000
          diff_trimmed = diff if len(diff)<=MAX_CHARS else diff[:MAX_CHARS] + "\n\n...[TRIMMED]"

          # 4) Промпт под UIKit + SwiftUI + URLSession
          system_prompt = """You are a senior iOS code reviewer.
          Project styles: UIKit and SwiftUI (code-only UI, no storyboards/xibs). Networking via URLSession (async/await), MVVM/Services.
          Review the PR unified diff and produce INLINE comments ONLY on newly ADDED lines, plus a short bulleted summary.

          Focus:
          • UIKit: constraints in loadView/viewDidLoad (not viewDidLayoutSubviews); [weak self]; main-thread UI; CALayer/CAGradientLayer perf; accessibility.
          • SwiftUI: correct @State/@StateObject/@ObservedObject/@EnvironmentObject; avoid heavy logic in View; cancel Task on disappear; no UI off main.
          • URLSession: async/await; timeouts; waitsForConnectivity; retry/backoff; safe Decodable; no secrets in logs; DI for tests.
          • General: localization (no hard-coded user strings), safe error handling, performance, style consistency (Swift), SPM pinning.

          Return STRICT JSON ONLY:
          {
            "summary": "short bullet list in markdown",
            "comments": [
              { "path": "path/to/file.swift", "line": 123, "body": "actionable suggestion in markdown" }
            ]
          }
          Paths MUST match +++ b/<path> in diff. Lines MUST be added lines only. No prose outside JSON."""

          user_prompt = f"<diff>\\n{diff_trimmed}\\n</diff>"

          payload = {
              "model": AI_MODEL,
              "temperature": 0.10,
              "messages": [
                  {"role":"system","content": system_prompt},
                  {"role":"user","content":   user_prompt}
              ],
              "max_tokens": 2000,
              "response_format": {"type": "json_object"}  # требуем чистый JSON
          }

          headers={"Content-Type":"application/json"}
          if AI_KEY:
              if AI_HDR.lower().startswith("authorization"):
                  headers["Authorization"]=f"Bearer {AI_KEY}"
              else:
                  headers[AI_HDR]=AI_KEY

          # 5) Вызов AI и устойчивое извлечение контента (content / reasoning_content / text / output_text)
          try:
              resp = requests.post(AI_URL, headers=headers, json=payload, timeout=120)
              status = resp.status_code
              data = resp.json() if status < 400 else {}
          except Exception as e:
              status = 0; data = {}

          content = None
          try:
              choice0 = (data.get("choices") or [{}])[0]
              msg = choice0.get("message") or {}
              content = msg.get("content")
              if not content:
                  content = msg.get("reasoning_content")
              if not content:
                  content = choice0.get("text")
              if not content:
                  content = data.get("output_text")
          except Exception:
              pass

          if content is None:
              preview = ""
              try: preview = json.dumps(data)[:600]
              except Exception: preview = str(data)[:600]
              content = json.dumps({"summary": f"AI endpoint returned no content field (status={status}). Raw preview: {preview}", "comments": []})

          def extract_json(s):
              s = "" if s is None else (s if isinstance(s,str) else str(s))
              s = s.strip()
              # попробуем напрямую как JSON:
              try:
                  return json.loads(s)
              except Exception:
                  pass
              # иначе вырежем внешний {...}
              try:
                  i = s.find('{'); j = s.rfind('}')
                  return json.loads(s[i:j+1]) if i!=-1 and j!=-1 else {"summary": s[:2000], "comments": []}
              except Exception:
                  return {"summary": s[:2000], "comments": []}

          result   = extract_json(content)
          summary  = result.get("summary","AI review")
          comments = result.get("comments",[])
          if not isinstance(comments,list): comments=[]

          # 6) Валидация: оставляем комментарии только на реально добавленные строки
          added_map={}
          for f in files:
              if not f["path"]: continue
              added = {ln["line"] for h in f["hunks"] for ln in h["lines"]}
              added_map[f["path"]] = added

          filtered=[]
          for c in comments:
              path=c.get("path"); line=c.get("line"); body=(c.get("body") or "").strip()
              if path in added_map and isinstance(line,int) and line in added_map[path] and body:
                  filtered.append({"path":path,"line":line,"side":"RIGHT","body":body})

          # 7) Публикуем review с инлайнами (или fallback — summary)
          session = requests.Session()
          session.headers.update({"Authorization": f"Bearer {GH_TOKEN}", "Accept": "application/vnd.github+json"})

          review_url = f"https://api.github.com/repos/{REPO}/pulls/{PR_NUMBER}/reviews"
          issues_url = f"https://api.github.com/repos/{REPO}/issues/{PR_NUMBER}/comments"

          if filtered:
              body={"event":"COMMENT","body":summary or "AI Review","comments":filtered[:50]}
              r = session.post(review_url, json=body, timeout=60)
              if r.status_code >= 300:
                  session.post(issues_url, json={"body": f"**AI Review**\\n\\n{summary}"}, timeout=60)
          else:
              session.post(issues_url, json={"body": f"**AI Review**\\n\\n{summary}"}, timeout=60)

          print("AI inline review done.")
          PY
