name: AI Inline Review (custom endpoint, OpenAI-OSS 120B, RU & fenced code)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check AI_API_KEY presence
        run: |
          if [ -z "${{ secrets.AI_API_KEY }}" ]; then
            echo "::error::AI_API_KEY is empty. Add it in Settings → Secrets → Actions."
            exit 1
          fi

      - name: Run AI Inline Review (inline script)
        env:
          # GitHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL:     ${{ github.repository }}
          PR_NUMBER:     ${{ github.event.pull_request.number }}
          BASE_SHA:      ${{ github.event.pull_request.base.sha }}
          HEAD_SHA:      ${{ github.event.pull_request.head.sha }}
          # AI service
          AI_API_URL:   ${{ vars.AI_API_URL || 'https://api.intelligence.io.solutions/api/v1/chat/completions' }}
          AI_API_KEY:   ${{ secrets.AI_API_KEY }}
          AI_API_HDR:   ${{ vars.AI_API_HDR || 'Authorization' }}   # 'Authorization' или 'x-api-key'
          AI_API_MODEL: openai/gpt-oss-120b
        run: |
          python - << 'PY'
          import os, sys, subprocess, json, re, requests

          REPO      = os.environ["REPO_FULL"]
          PR_NUMBER = os.environ["PR_NUMBER"]
          BASE      = os.environ["BASE_SHA"]
          HEAD      = os.environ["HEAD_SHA"]
          GH_TOKEN  = os.environ["GITHUB_TOKEN"]
          AI_URL    = os.getenv("AI_API_URL","").strip()
          AI_KEY    = os.getenv("AI_API_KEY","").strip()
          AI_HDR    = os.getenv("AI_API_HDR","Authorization").strip()
          AI_MODEL  = os.getenv("AI_API_MODEL","openai/gpt-oss-120b").strip()

          def run(cmd):
              return subprocess.check_output(cmd, shell=True, text=True, stderr=subprocess.STDOUT)

          # --- diff с точными новыми строками
          try:
              diff = run(f'git diff --unified=0 --no-color "{BASE}" "{HEAD}"')
          except subprocess.CalledProcessError as e:
              print("::error::git diff failed:", e.output)
              sys.exit(1)
          if not diff.strip():
              print("::notice::Empty diff. Nothing to review.")
              sys.exit(0)

          # Карта добавленных строк по файлам
          files=[]; current=None; new_line=None
          for line in diff.splitlines():
              if line.startswith("diff --git "):
                  current={"path":None,"hunks":[]}; files.append(current); new_line=None
              elif line.startswith("+++ b/"):
                  if current: current["path"]=line[len("+++ b/"):].strip()
              elif line.startswith("@@"):
                  try:
                      marker=line.split("@@")[1].strip()
                      plus=[p for p in marker.split() if p.startswith('+')][0][1:]
                      new_line=int(plus.split(',')[0]) if ',' in plus else int(plus)
                      current["hunks"].append({"start":new_line,"lines":[]})
                  except Exception:
                      pass
              else:
                  if current and current["hunks"]:
                      h=current["hunks"][-1]
                      if line.startswith('+') and not line.startswith('+++'):
                          h["lines"].append({"line":new_line,"text":line[1:]}); new_line+=1
                      elif line.startswith('-') and not line.startswith('---'):
                          pass
                      else:
                          new_line+=1

          # Ограничим размер диффа, чтобы не ронять модель
          MAX_CHARS=120_000
          diff_trimmed = diff if len(diff)<=MAX_CHARS else diff[:MAX_CHARS] + "\n\n...[TRIMMED]"

          # --- Промпт (РУССКИЙ обязательно)
          system_prompt = """Ты — строгий сеньор iOS code reviewer.
          ВСЁ, что ты выводишь (summary и комментарии), ДОЛЖНО быть ТОЛЬКО НА РУССКОМ ЯЗЫКЕ.
          Рендеринг для GitHub:
          - Любой код — только в fenced-блоках: ```swift ...```, ```diff ...```, ```suggestion ...```
          - Без лишних пустых строк до/после fenced-блоков.
          - Inline-комментарии — только по ДОБАВЛЕННЫМ строкам.
          Контекст: UIKit/SwiftUI верстка кодом, URLSession async/await, MVVM/Services.

          Верни СТРОГИЙ JSON:
          {
            "summary": "краткий список пунктов в markdown (на русском)",
            "comments": [
              { "path": "path/from/+++ b/", "line": 123, "body": "текст на русском; если правка — fenced ```suggestion ... ```" }
            ]
          }"""

          user_prompt = f"<diff>\\n{diff_trimmed}\\n</diff>"
          payload = {
              "model": AI_MODEL,
              "temperature": 0.10,
              "messages": [
                  {"role":"system","content": system_prompt},
                  {"role":"user","content":   user_prompt}
              ],
              "max_tokens": 2000,
              "response_format": {"type": "json_object"}
          }
          headers={"Content-Type":"application/json"}
          if AI_KEY:
              if AI_HDR.lower().startswith("authorization"):
                  headers["Authorization"]=f"Bearer {AI_KEY}"
              else:
                  headers[AI_HDR]=AI_KEY

          def call_ai(inp):
              r = requests.post(AI_URL, headers=headers, json=inp, timeout=120)
              try: return r.status_code, r.json()
              except Exception: return r.status_code, {}

          status, data = call_ai(payload)
          # Извлечь content
          content = None
          try:
              choice0 = (data.get("choices") or [{}])[0]
              msg = choice0.get("message") or {}
              content = msg.get("content") or msg.get("reasoning_content") or choice0.get("text") or data.get("output_text")
          except Exception:
              pass
          if not content:
              content = json.dumps({"summary":"AI endpoint returned no content.", "comments":[]})

          # Устойчивое извлечение JSON
          def extract_json(s):
              s = s if isinstance(s,str) else str(s)
              s = s.strip()
              try: return json.loads(s)
              except: pass
              i=s.find('{'); j=s.rfind('}')
              if i!=-1 and j!=-1:
                  try: return json.loads(s[i:j+1])
                  except: pass
              return {"summary": s[:2000], "comments":[]}

          result = extract_json(content)

          # Если summary явно не русскоязычный — быстро переводим второй просьбой
          def is_russian(txt):
              cyr = len(re.findall(r'[А-Яа-яЁё]', txt))
              lat = len(re.findall(r'[A-Za-z]', txt))
              return cyr >= lat
          summary = result.get("summary","")
          if summary and not is_russian(summary):
              tr_payload = {
                  "model": AI_MODEL,
                  "messages": [
                      {"role":"system","content":"Переведи следующий текст на русский, сохраняя markdown-структуру: "},
                      {"role":"user","content": summary}
                  ],
                  "max_tokens": 1200
              }
              _, tr_data = call_ai(tr_payload)
              try:
                  summary = (tr_data.get("choices") or [{}])[0].get("message",{}).get("content") or summary
              except: pass

          comments = result.get("comments",[])
          if not isinstance(comments, list): comments=[]

          # Фильтрация по реально добавленным строкам
          added_map={}
          for f in files:
              if not f["path"]: continue
              added = {ln["line"] for h in f["hunks"] for ln in h["lines"]}
              added_map[f["path"]] = added

          filtered=[]
          for c in comments:
              path=c.get("path"); line=c.get("line"); body=(c.get("body") or "").strip()
              if path in added_map and isinstance(line,int) and line in added_map[path] and body:
                  filtered.append({"path":path,"line":line,"body":body})

          sess = requests.Session()
          sess.headers.update({"Authorization": f"Bearer {GH_TOKEN}", "Accept": "application/vnd.github+json"})

          # 1) summary — как обычный комментарий к PR (issue comment)
          issues_url = f"https://api.github.com/repos/{REPO}/issues/{PR_NUMBER}/comments"
          sess.post(issues_url, json={"body": f"**AI Review (RU)**\n{summary}"}, timeout=60)

          # 2) инлайн-комменты — через /pulls/{pr}/comments (line/side), чтобы ПОДСВЕТИТЬ КОНКРЕТНУЮ СТРОКУ
          prc_url = f"https://api.github.com/repos/{REPO}/pulls/{PR_NUMBER}/comments"
          for c in filtered[:60]:
              payload = {
                  "body": c["body"],
                  "commit_id": HEAD,
                  "path": c["path"],
                  "side": "RIGHT",
                  "line": c["line"]
              }
              r = sess.post(prc_url, json=payload, timeout=60)
              if r.status_code >= 300:
                  # если что-то пошло не так — не ломаем джобу
                  print(f"::warning::Inline comment failed for {c['path']}:{c['line']} -> {r.status_code} {r.text[:200]}")

          print("AI inline review done.")
          PY
