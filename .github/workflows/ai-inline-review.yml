name: AI Inline Review (custom endpoint, OpenAI-OSS 120B, RU & inline)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check AI_API_KEY presence
        run: |
          if [ -z "${{ secrets.AI_API_KEY }}" ]; then
            echo "::error::AI_API_KEY is empty. Add it in Settings → Secrets → Actions."
            exit 1
          fi

      - name: Run AI Inline Review (inline script)
        env:
          # GitHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL:     ${{ github.repository }}
          PR_NUMBER:     ${{ github.event.pull_request.number }}
          BASE_SHA:      ${{ github.event.pull_request.base.sha }}
          HEAD_SHA:      ${{ github.event.pull_request.head.sha }}
          # AI service
          AI_API_URL:   ${{ vars.AI_API_URL || 'https://api.intelligence.io.solutions/api/v1/chat/completions' }}
          AI_API_KEY:   ${{ secrets.AI_API_KEY }}
          AI_API_HDR:   ${{ vars.AI_API_HDR || 'Authorization' }}   # 'Authorization' или 'x-api-key'
          AI_API_MODEL: openai/gpt-oss-120b
        run: |
          python - << 'PY'
          import os, sys, subprocess, json, re, requests

          REPO      = os.environ["REPO_FULL"]
          PR_NUMBER = os.environ["PR_NUMBER"]
          BASE      = os.environ["BASE_SHA"]
          HEAD      = os.environ["HEAD_SHA"]
          GH_TOKEN  = os.environ["GITHUB_TOKEN"]
          AI_URL    = os.getenv("AI_API_URL","").strip()
          AI_KEY    = os.getenv("AI_API_KEY","").strip()
          AI_HDR    = os.getenv("AI_API_HDR","Authorization").strip()
          AI_MODEL  = os.getenv("AI_API_MODEL","openai/gpt-oss-120b").strip()

          # --- 1) Забираем patch-и файлов из GitHub (а не локальный git diff)
          sess = requests.Session()
          sess.headers.update({"Authorization": f"Bearer {GH_TOKEN}", "Accept": "application/vnd.github+json"})

          files_api = f"https://api.github.com/repos/{REPO}/pulls/{PR_NUMBER}/files"
          all_files = []
          page = 1
          while True:
              r = sess.get(files_api, params={"per_page": 100, "page": page}, timeout=60)
              r.raise_for_status()
              chunk = r.json()
              all_files += chunk
              if len(chunk) < 100:
                  break
              page += 1

          if not all_files:
              print("::notice::No files to review.")
              sys.exit(0)

          # --- 2) Карта добавленных строк по patch GitHub
          HUNK_RE = re.compile(r'^@@\s+-(\d+)(?:,\d+)?\s+\+(\d+)(?:,\d+)?\s+@@')
          added_map = {}  # path -> set(new_line_numbers)
          for f in all_files:
              path  = f.get("filename")
              patch = f.get("patch")
              if not path or not patch:
                  continue

              added = set()
              new_line = 0
              for line in patch.splitlines():
                  m = HUNK_RE.match(line)
                  if m:
                      new_line = int(m.group(2))  # старт в новой версии файла
                      continue
                  if not line:
                      continue
                  tag = line[0]
                  if tag == '+':
                      added.add(new_line)
                      new_line += 1
                  elif tag == '-':
                      # удалённая строка не увеличивает номер в новой версии
                      pass
                  else:
                      new_line += 1
              if added:
                  added_map[path] = added

          if not any(added_map.values()):
              print("::notice::No added lines found in GitHub patch. Nothing to review.")
              sys.exit(0)

          # --- 3) “Сжатый” diff для модели (не для позиций строк)
          def run(cmd):
              return subprocess.check_output(cmd, shell=True, text=True, stderr=subprocess.STDOUT)
          try:
              diff = run(f'git diff --unified=0 --no-color "{BASE}" "{HEAD}"')
          except subprocess.CalledProcessError as e:
              diff = ""
          MAX_CHARS = 120_000
          diff_trimmed = diff if len(diff) <= MAX_CHARS else diff[:MAX_CHARS] + "\n\n...[TRIMMED]"

          # --- 4) Промпт (РУССКИЙ вывод) → JSON
          system_prompt = """Ты — строгий сеньор iOS code reviewer.
          ВСЁ (summary и комментарии) ДОЛЖНО быть ТОЛЬКО НА РУССКОМ.
          Рендеринг для GitHub:
          - Любой код — только в fenced-блоках: ```swift ...```, ```diff ...```, ```suggestion ...```
          - Без лишних пустых строк до/после fenced-блоков.
          - Inline-комментарии — только по ДОБАВЛЕННЫМ строкам.
          Контекст: UIKit/SwiftUI верстка кодом, URLSession async/await, MVVM/Services.
          Верни СТРОГИЙ JSON:
          {
            "summary": "краткий список пунктов в markdown (на русском)",
            "comments": [
              { "path": "path/from/+++ b/", "line": 123, "body": "текст на русском; если правка — fenced ```suggestion ... ```" }
            ]
          }"""

          user_prompt = f"<diff>\\n{diff_trimmed}\\n</diff>"
          payload = {
              "model": AI_MODEL,
              "temperature": 0.1,
              "messages": [
                  {"role":"system","content": system_prompt},
                  {"role":"user","content":   user_prompt}
              ],
              "max_tokens": 2000,
              "response_format": {"type": "json_object"}
          }
          headers={"Content-Type":"application/json"}
          if AI_KEY:
              if AI_HDR.lower().startswith("authorization"):
                  headers["Authorization"]=f"Bearer {AI_KEY}"
              else:
                  headers[AI_HDR]=AI_KEY

          def call_ai(inp):
              r = requests.post(AI_URL, headers=headers, json=inp, timeout=120)
              try:
                  return r.status_code, r.json()
              except Exception:
                  return r.status_code, {}

          status, data = call_ai(payload)
          content = None
          try:
              choice0 = (data.get("choices") or [{}])[0]
              msg = choice0.get("message") or {}
              content = msg.get("content") or msg.get("reasoning_content") or choice0.get("text") or data.get("output_text")
          except Exception:
              pass
          if not content:
              content = json.dumps({"summary":"AI endpoint returned no content.", "comments":[]})

          def extract_json(s):
              s = s if isinstance(s,str) else str(s)
              s = s.strip()
              try:
                  return json.loads(s)
              except:
                  pass
              i = s.find('{'); j = s.rfind('}')
              if i != -1 and j != -1:
                  try:
                      return json.loads(s[i:j+1])
                  except:
                      pass
              return {"summary": s[:2000], "comments":[]}

          result = extract_json(content)

          # --- 5) Если summary не на русском — быстрый перевод
          def is_russian(txt):
              cyr = len(re.findall(r'[А-Яа-яЁё]', txt))
              lat = len(re.findall(r'[A-Za-z]', txt))
              return cyr >= lat

          summary = result.get("summary","")
          if summary and not is_russian(summary):
              tr_payload = {
                  "model": AI_MODEL,
                  "messages": [
                      {"role":"system","content":"Переведи текст на русский, сохраняя markdown:"},
                      {"role":"user","content": summary}
                  ],
                  "max_tokens": 1200
              }
              _, tr_data = call_ai(tr_payload)
              try:
                  summary = (tr_data.get("choices") or [{}])[0].get("message",{}).get("content") or summary
              except:
                  pass

          comments = result.get("comments",[])
          if not isinstance(comments, list):
              comments = []

          # --- 6) Фильтруем по реально ДОБАВЛЕННЫМ строкам из GitHub patch
          filtered=[]
          for c in comments:
              path = c.get("path")
              line = c.get("line")
              body = (c.get("body") or "").strip()
              if not path or not isinstance(line,int) or not body:
                  continue
              added = added_map.get(path)
              if not added:
                  continue
              if line in added:
                  filtered.append({"path":path,"line":line,"body":body})

          # --- 7) Публикуем summary + инлайны
          # summary — обычный комментарий к PR
          issues_url = f"https://api.github.com/repos/{REPO}/issues/{PR_NUMBER}/comments"
          sess.post(issues_url, json={"body": f"**AI Review (RU)**\n{summary}"}, timeout=60)

          # инлайны — /pulls/{pr}/comments (точные line в HEAD-версии)
          prc_url = f"https://api.github.com/repos/{REPO}/pulls/{PR_NUMBER}/comments"
          for c in filtered[:60]:
              payload = {
                  "body": c["body"],
                  "commit_id": HEAD,
                  "path": c["path"],
                  "side": "RIGHT",
                  "line": c["line"]
              }
              r = sess.post(prc_url, json=payload, timeout=60)
              if r.status_code >= 300:
                  print(f"::warning::Inline comment failed for {c['path']}:{c['line']} -> {r.status_code} {r.text[:200]}")

          print("AI inline review done.")
          PY
